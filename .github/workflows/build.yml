name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # gradle-wrapper.properties points at a China mirror (fast for the author on
      # Android/FCL, slow or flaky from GitHub runners): use the official
      # distribution in CI only, without touching the committed file.
      - name: Use the official Gradle distribution for CI
        run: |
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # ./gradlew build also runs the JUnit tests (DurationParserTest).
      # Loom downloads Minecraft 26.2 and the mappings on the first run; the
      # Gradle cache above keeps later runs fast.
      - name: Build and test
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload the built jars
        uses: actions/upload-artifact@v7
        with:
          name: trade-master-jars
          # the mod jar only: withSourcesJar() also emits -sources.jar, which is a
          # dev aid and not what the README advertises as the download
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
