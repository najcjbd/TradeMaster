name: Build

on:
  push:
    branches: [ multiversion ]
  pull_request:
    branches: [ multiversion ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test all Fabric nodes (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # gradle-wrapper.properties points at a China mirror (fast for the author on
      # Android/FCL, slow or flaky from GitHub runners): use the official
      # distribution in CI only, without touching the committed file.
      - name: Use the official Gradle distribution for CI
        run: |
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Minecraft/Loom downloads and the per-node Stonecutter caches are the slow,
      # network-bound part of a cold run: persist them between workflow runs.
      - name: Cache Loom and Stonecutter caches
        uses: actions/cache@v4
        with:
          path: |
            .gradle/loom-cache
            versions/*/.gradle/loom-cache
            versions/*/build/loom-cache
          key: loom-${{ runner.os }}-${{ hashFiles('settings.gradle.kts', 'build.gradle.kts', 'gradle.properties', 'versions/*/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            loom-${{ runner.os }}-

      # One Stonecutter node = one Minecraft version. Building every Fabric node
      # runs each node's headless JUnit suite (src/test) against that version.
      - name: Build and test all Fabric nodes
        run: >
          ./gradlew --continue
          :1.18.2-fabric:build :1.19.2-fabric:build :1.20.1-fabric:build
          :1.21.1-fabric:build :1.21.4-fabric:build :1.21.5-fabric:build
          :1.21.8-fabric:build :26.1-fabric:build :26.2-fabric:build :26.3-fabric:build
          --console=plain --stacktrace

      - name: Upload the built jars
        uses: actions/upload-artifact@v7
        with:
          name: trade-master-jars
          # the mod jars only: a dev build may also emit -sources.jar, which is
          # not what the README advertises as the download
          path: |
            versions/*-fabric/build/libs/*.jar
            !versions/*-fabric/build/libs/*-sources.jar
          if-no-files-found: error
