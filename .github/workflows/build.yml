name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # gradle-wrapper.properties points at a China mirror (fast for the author on
      # Android/FCL, slow or flaky from GitHub runners): use the official
      # distribution in CI only, without touching the committed file.
      - name: Use the official Gradle distribution for CI
        run: |
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # ./gradlew build runs the whole headless JUnit suite (src/test).
      # Loom downloads Minecraft 26.2 and the mappings on the first run; the
      # Gradle cache above keeps later runs fast.
      - name: Build and test
        run: ./gradlew build --console=plain --stacktrace

      - name: Upload the built jars
        uses: actions/upload-artifact@v7
        with:
          name: trade-master-jars
          # the mod jar only: withSourcesJar() also emits -sources.jar, which is a
          # dev aid and not what the README advertises as the download
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  # The Fabric client game tests (src/gametest) need a REAL client: an X display and the
  # game assets Loom downloads on first use. They are a separate job because `build` does
  # not compile or run the gametest source set at all, and booting Minecraft is slow.
  client-gametest:
    name: Client game tests (JDK 25, headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use the official Gradle distribution for CI
        run: |
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # the client needs an X display (xvfb) AND the audio library the override below points
      # at: a bare runner has neither guaranteed, and a missing library would crash the client
      # at boot for a reason unrelated to the code
      - name: Install the client test dependencies
        # libgl1-mesa-dri provides the llvmpipe software renderer the headless client needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libopenal1 libgl1-mesa-dri

      - name: Run the client game tests headlessly
        env:
          CI: true
          # a headless runner has no audio device, and the LWJGL OpenAL bundled with the game
          # can crash on teardown in some environments: use the system OpenAL Soft with the
          # null backend. Harmless where audio works.
          JAVA_TOOL_OPTIONS: "-Dorg.lwjgl.openal.libname=libopenal.so.1"
          ALSOFT_DRIVERS: "null"
          # force the software renderer: the runner has no GPU
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" ./gradlew runClientGameTest --console=plain --stacktrace

      # a failing client test is hard to diagnose without the client log
      - name: Upload the client test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-logs
          if-no-files-found: ignore
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
